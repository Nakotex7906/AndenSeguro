version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: anden_seguro_db
    environment:
      POSTGRES_DB: anden_seguro_db
      POSTGRES_USER: anden_user
      POSTGRES_PASSWORD: anden_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
